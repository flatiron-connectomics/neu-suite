name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first — no point finishing CI for a
# commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the shared neu-env environment uses; 3.11 is the floor pyproject
        # declares. Testing 3.11 matters more here than anywhere else in the suite: every
        # other package is pinned to 3.12 by vol2mesh and dvidutils, and this one exists
        # precisely so the shared types stay reachable without that constraint. If 3.11
        # ever breaks, the package has stopped doing its job.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # numpy is the only dependency and it has wheels everywhere, so a plain pip
        # install is faithful here — no conda, no siblings, nothing to check out.
        # The consumers are not so lucky; see their workflows.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `tests/test_imports.py` asserts the numpy-only property — the package's whole
      # reason for existing — in a fresh interpreter, so it is covered here rather than
      # by a separate step. This job is also the only place it is checked against an
      # environment where nothing else is installed.
      - name: Test
        run: pytest -q

  # Ask the documentation site to rebuild. No CLI here, but the README is included in
  # the site verbatim. `main` only, and only once the tests pass.
  docs:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild flatiron-connectomics/neu-suite
        env:
          # The workflow's own GITHUB_TOKEN is scoped to THIS repository and cannot
          # dispatch to another one, so this needs a separate token with contents:write
          # on neu-suite. It is an ORG secret with a per-repo allowlist, so a new repo
          # must be granted it explicitly. When absent the step says so and succeeds —
          # a docs refresh that did not happen must not turn a green test run red.
          TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::DOCS_DISPATCH_TOKEN is not set; skipping. The site will pick this commit up on its next scheduled build."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/flatiron-connectomics/neu-suite/dispatches \
            -d "{\"event_type\":\"package-updated\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\"}}" || echo 000)
          if [ "$code" = "204" ]; then
            echo "::notice::asked neu-suite to rebuild its docs for $GITHUB_SHA"
          else
            echo "::warning::docs dispatch returned HTTP $code; the site rebuilds on its own schedule instead. A 403 means DOCS_DISPATCH_TOKEN lacks contents:write on flatiron-connectomics/neu-suite — note that a fine-grained token pinned to a repo does NOT follow a delete-and-recreate, since the new repo has a new id."
          fi
