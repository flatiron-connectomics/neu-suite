[workspace]
name = "em-blockrun"
version = "0.1.0"
description = "Resumable, chunked parallel maps on dask — locally or on Flatiron Rusty/SLURM."
authors = ["Erik Schomburg <eschomburg@flatironinstitute.org>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.14"
dask = "*"
distributed = "*"
dask-jobqueue = ">=0.8"
pyyaml = "*"

[pypi-dependencies]
em-blockrun = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = "*"

[feature.dev.tasks]
test = "pytest -q"

[environments]
dev = ["dev"]
