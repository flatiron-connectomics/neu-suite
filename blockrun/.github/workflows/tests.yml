name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first — no point finishing CI for a
# commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the shared neu-env environment uses; 3.11 is the floor
        # pyproject declares, and testing it is the only thing keeping that
        # declaration honest.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Every dependency is on PyPI and none is a compiled extension pinned to a
        # conda build, so a plain pip install is faithful here. The consumers are
        # not so lucky — see their workflows.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Check the bundled dask templates ship in a built wheel
        # The templates are package DATA resolved via importlib.resources. If they
        # are ever dropped from the wheel, `--config dask-local` breaks for every
        # consumer while the test suite — running from a source tree — stays green.
        run: |
          pip install build
          # No --no-isolation: `build` provisions hatchling into a temp env itself.
          # Passing it locally works only because hatchling is installed there.
          python -m build --wheel -o dist/
          python - <<'PY'
          import glob, zipfile, sys
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          want = {"blockrun/configs/dask-local.yaml",
                  "blockrun/configs/dask-slurm-example.yaml"}
          missing = want - set(names)
          sys.exit(f"missing from wheel: {sorted(missing)}" if missing else 0)
          PY

  # Ask the documentation site to rebuild. This package has no CLI, but its README is
  # included in the site verbatim, and both consumers' pages describe behaviour that
  # lives here. `main` only, and only once the tests pass.
  docs:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild flatiron-connectomics/neu-suite
        env:
          # The workflow's own GITHUB_TOKEN is scoped to THIS repository and cannot
          # dispatch to another one, so this needs a separate token with contents:write
          # on neu-suite. When it is absent the step says so and succeeds — a docs
          # refresh that did not happen must not turn a green test run red, and the
          # site rebuilds on its nightly schedule regardless.
          TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::DOCS_DISPATCH_TOKEN is not set; skipping. The site will pick this commit up on its next scheduled build."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/flatiron-connectomics/neu-suite/dispatches \
            -d "{\"event_type\":\"package-updated\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\"}}"
          echo "::notice::asked neu-suite to rebuild its docs for $GITHUB_SHA"
