[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neu-morpho"
version = "0.1.0"
description = "Segment morphology: multi-resolution Draco meshes from segmentation volumes, into neuroglancer-precomputed, and measurement of meshes and skeletons."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# vol2mesh and dvidutils are only built for py312 on flyem-forge (no py313
# build), which pins this package and the whole shared env to 3.12.
requires-python = ">=3.12,<3.13"
authors = [{ name = "Erik Schomburg", email = "eschomburg@flatironinstitute.org" }]
#
# NOT listed below, because they are conda-only (flyem-forge) with no PyPI
# equivalent — pip can never resolve them, so the conda env must provide them:
#   vol2mesh    multi-resolution Draco meshes for neuroglancer
#   dvidutils   Draco codec backing vol2mesh Mesh.serialize('drc')
#
# In the shared conda env the rest come from conda-forge, so install with
# `pip install --no-deps -e .` to keep pip from re-resolving them.
dependencies = [
    "numpy>=2",
    "scipy",
    "tensorstore>=0.1.70",
    # Skeleton class (BSD-3) for the skeleton fragment store and the precomputed
    # skeleton writer and reader. >=0.7.3: earlier `consolidate` promoted edges to int64.
    "osteoid>=0.7.3",
    "DracoPy",         # Draco codec binding used by vol2mesh.multires
    "trimesh",         # vol2mesh.multires LOD slicing (trim_mesh_to_box)
    "neu-lib",         # ScaleInfo. numpy-only.
    "neu-vol",         # segmentation-array I/O
    "blockrun",        # dask/SLURM chunked-map substrate
]

[project.scripts]
neu-morpho = "neu_morpho.cli:main"

[project.optional-dependencies]
# Per-body measurement over PUBLISHED output (neu_morpho/measure/). An analysis layer,
# so its deps are optional: `metrics.py` is numpy only and the pipeline needs none of
# this. pandas/pyarrow are imported INSIDE functions, so `import neu_morpho` does not
# pay for them and the CLI stays fast — the same rule neu-mark's `cli` follows.
measure = [
    "pandas",   # result tables
    "pyarrow",  # parquet, which unlike csv round-trips a nullable integer column
]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["neu_morpho"]
# No dask config data here: the templates live in blockrun, next to start_dask,
# and `--config dask-local` resolves through it. Site-specific configs stay out of the
# repo entirely — the top-level `configs/` is gitignored.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises a real dask cluster or heavy meshing; slower to run",
]
