[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neu-recipe"
version = "0.1.0"
description = "Run a recipe of commands in order, with a record of every run, over volumes named in a library."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Erik Schomburg", email = "eschomburg@flatironinstitute.org" }]
# The runner and the library are standard library only. neu-vol is needed only by
# `neu-recipe library --check`, which probes each location.
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
check = ["neu-vol"]

[project.scripts]
neu-recipe = "neu_recipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["neu_recipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
