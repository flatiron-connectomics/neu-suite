name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 only, matching `requires-python`. Two reasons it is not a range: unlike
        # neu-lib there is no 3.11 floor to keep honest, since this package sits above the
        # pinned half of the suite — and upward, **fastmorph publishes a cp312 wheel and no
        # cp313 one**, so a 3.13 job fails at install rather than at a test. Add 3.13 here
        # when it ships one; the code has nothing 3.12-specific in it.
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      # neu-lib is the only sibling, and it is not on PyPI — so pip would go looking for
      # the `neu-lib` requirement there. Install it from source first.
      - uses: actions/checkout@v7
        with:
          repository: flatiron-connectomics/neu-lib
          path: .siblings/neu-lib

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # **This is the one package in the suite whose CI runs EVERY test.** Every
      # dependency is pip-installable — no tensorstore, no vol2mesh, no dvidutils, no
      # neuclease, no kimimaro — so nothing here is skipped for want of conda. That is a
      # property worth protecting: adding a conda-only dependency would cost it.
      #
      # cupy is deliberately absent. The wheel is CUDA-version specific and there is no
      # GPU on a runner anyway, so the device tests skip and the host paths are what get
      # exercised. `test_backend.py` is written so that both halves are covered: the
      # dispatch logic is tested with a fake device array that needs no cupy at all.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./.siblings/neu-lib
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      # There is no CLI yet, so the packaging check is that the wheel imports and the lazy
      # exports resolve from a directory with no checkout in sight.
      - name: Smoke-test the built wheel
        run: |
          pip install build
          python -m build --wheel -o dist/
          pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp && python -c "
          import sys, neu_proc
          # The lazy top-level exports (PEP 562) must not drag an algorithm library in:
          # importing the package should pay for neither scipy nor cc3d.
          for heavy in ('scipy', 'cc3d', 'fastmorph', 'skimage'):
              assert heavy not in sys.modules, f'importing neu_proc pulled in {heavy}'
          assert callable(neu_proc.dust) and callable(neu_proc.dilate)
          print('lazy exports resolve; version', neu_proc.__version__)
          "

  # Ask the documentation site to rebuild, so the published README and API reference follow
  # this commit. `main` only, and only once the tests pass.
  docs:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild flatiron-connectomics/neu-suite
        env:
          # The workflow's own GITHUB_TOKEN is scoped to THIS repository and cannot
          # dispatch to another one, so this needs a separate token with contents:write on
          # neu-suite. It is an ORG secret with a per-repo allowlist, so a NEW repo has to
          # be granted it explicitly:
          #
          #   gh api -X PUT orgs/flatiron-connectomics/actions/secrets/\
          #     DOCS_DISPATCH_TOKEN/repositories/<repo_id>
          #
          # When absent the step says so and succeeds — a docs refresh that did not happen
          # must not turn a green test run red.
          TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::DOCS_DISPATCH_TOKEN is not set; skipping. The site will pick this commit up on its next scheduled build."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/flatiron-connectomics/neu-suite/dispatches \
            -d "{\"event_type\":\"package-updated\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\"}}" || echo 000)
          if [ "$code" = "204" ]; then
            echo "::notice::asked neu-suite to rebuild its docs for $GITHUB_SHA"
          else
            echo "::warning::docs dispatch returned HTTP $code; the site rebuilds on its own schedule instead. A 403 means DOCS_DISPATCH_TOKEN lacks contents:write on flatiron-connectomics/neu-suite — note that a fine-grained token pinned to a repo does NOT follow a delete-and-recreate, since the new repo has a new id."
          fi
